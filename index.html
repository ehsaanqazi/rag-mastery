<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>RAG Engineering Mastery</title>
    <meta
      name="description"
      content="A comprehensive, free, hands-on RAG engineering curriculum covering document processing, embeddings, vector databases, retrieval, reranking, Graph RAG, Agentic RAG and production deployment."
    />
    <meta property="og:title" content="RAG Engineering Mastery" />
    <meta
      property="og:description"
      content="From fundamentals to production-ready retrieval systems. Learn. Retrieve. Reason. Build. Deploy."
    />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#4f46e5" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('rag-mastery:theme');
          var dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>RAG Engineering Mastery needs JavaScript to render its lessons.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
